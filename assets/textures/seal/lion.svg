<?xml version="1.0" encoding="UTF-8"?>
<!-- The standing lion carved in the heart of the Chamber's seal (docs/art/boss_chamber_spec.md 2.3), drawn by hand
     by the team for A Selagem: a lion rampant in profile facing left, head up. White fill = the raised body (its
     outline, relief and gold edge come from its distance field); red strokes = the cuts inside it (eye, mouth, mane,
     claws, the lines of shoulder and haunch). 1 unit = 0.03 m; the lion stands 140 units (4.2 m) from hind paw to ear.
     tools/make_seal_lion.gd turns it into assets/textures/seal/lion_sdf.res. -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 160 160">
  <g fill="#ffffff" stroke="#ffffff" stroke-linejoin="round" stroke-linecap="round">
    <!-- tail: out of the rump, an S up behind the back, a flame of a tuft -->
    <path d="M 96 100 C 112 102 124 92 122 76 C 120 62 108 60 108 50" fill="none" stroke-width="5"/>
    <path d="M 108 52 C 100 50 98 40 104 30 C 104 38 110 38 112 32 C 114 40 120 42 120 34 C 124 44 118 54 110 54 Z" stroke-width="1"/>
    <!-- standing hind leg: thigh, shank back to the hock, foot forward on the ground -->
    <path d="M 82 92 C 92 96 96 106 92 114" fill="none" stroke-width="17"/>
    <path d="M 91 112 L 93 132" fill="none" stroke-width="9"/>
    <path d="M 93 132 L 78 146" fill="none" stroke-width="7"/>
    <path d="M 72 142 C 70 146 72 150 78 150 L 86 150 C 88 146 84 141 80 141 Z" stroke-width="2"/>
    <!-- raised hind leg: thigh forward, shank down to the hock, paw reaching forward -->
    <path d="M 78 96 C 70 100 64 104 62 110" fill="none" stroke-width="14"/>
    <path d="M 62 110 L 68 124" fill="none" stroke-width="8"/>
    <path d="M 68 124 L 54 128" fill="none" stroke-width="6.5"/>
    <path d="M 50 124 C 46 126 46 132 50 133 L 56 132 C 58 129 56 125 53 124 Z" stroke-width="2"/>
    <!-- body: chest high, a narrow waist, the haunch -->
    <path d="M 54 44 C 48 52 50 62 56 72 C 60 80 64 88 70 96 C 76 104 92 106 98 98 C 102 90 94 80 90 70 C 86 58 86 48 82 40 Z" stroke-width="2"/>
    <!-- lower foreleg: from the chest, elbow down, forearm forward to a paw -->
    <path d="M 58 62 C 50 66 46 70 44 72" fill="none" stroke-width="9"/>
    <path d="M 44 72 L 32 72" fill="none" stroke-width="6.5"/>
    <path d="M 32 67 C 27 66 24 70 26 74 L 30 77 C 34 76 35 70 32 67 Z" stroke-width="2"/>
    <!-- upper foreleg: from the shoulder up and forward to a paw clawing the air -->
    <path d="M 62 52 C 56 50 50 50 46 50" fill="none" stroke-width="10"/>
    <path d="M 46 50 L 32 44" fill="none" stroke-width="7"/>
    <path d="M 31 39 C 26 38 23 42 24 46 L 27 49 C 32 49 34 43 31 39 Z" stroke-width="2"/>
    <!-- mane: tongues of hair round the back of the head and down the neck -->
    <path d="M 56 12 L 62 6 L 64 12 L 72 6 L 72 13 L 81 10 L 78 17 L 88 17 L 82 23 L 91 27 L 83 30 L 90 37 L 81 38 L 86 46 L 77 44 L 78 52 L 70 46 L 66 54 L 62 46 L 54 50 L 52 40 L 48 34 Z" stroke-width="1.5"/>
    <!-- head: skull, brow, the muzzle out to the left, an open jaw, an ear up -->
    <path d="M 52 14 C 60 12 66 16 66 24 C 66 32 62 38 56 40 L 50 40 C 46 40 44 38 42 36 L 40 32 C 38 30 38 27 40 25 L 46 21 C 48 17 50 15 52 14 Z" stroke-width="1.5"/>
    <path d="M 40 36 L 47 37 L 52 44 C 48 46 43 44 41 40 Z" stroke-width="1"/>
    <path d="M 60 13 L 63 5 L 67 13 Z" stroke-width="1.5"/>
  </g>
  <g fill="none" stroke="#ff0000" stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
    <!-- eye, nostril, mouth -->
    <circle cx="51" cy="25" r="1.6" fill="#ff0000" stroke="none"/>
    <path d="M 41 28 L 44 28"/>
    <path d="M 40 34 C 44 35 47 35 50 37"/>
    <!-- mane strands -->
    <path d="M 66 16 C 72 20 74 26 72 32"/>
    <path d="M 70 34 C 76 38 76 42 72 46"/>
    <path d="M 62 40 C 64 44 64 46 62 48"/>
    <!-- shoulder and haunch -->
    <path d="M 66 50 C 62 54 60 58 62 62"/>
    <path d="M 80 94 C 86 90 90 92 92 98"/>
    <!-- claws -->
    <path d="M 25 42 L 22 41"/>
    <path d="M 27 70 L 24 70"/>
    <path d="M 47 128 L 44 128"/>
    <path d="M 74 149 L 71 150"/>
    <!-- tail tuft -->
    <path d="M 110 50 C 108 44 110 40 112 36"/>
  </g>
</svg>
